<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema TI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: white; font-family: Arial, sans-serif; }
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 250px; background: #020617; padding: 30px;
      display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
    }
    .sidebar h2 { font-size: 24px; margin-bottom: 8px; color: #e2e8f0; }
    .sidebar small { color: #475569; font-size: 12px; display: block; margin-bottom: 40px; }
    .sidebar nav { display: flex; flex-direction: column; gap: 8px; }
    .sidebar nav a { color: #94a3b8; text-decoration: none; font-size: 15px; padding: 10px 14px; border-radius: 8px; transition: 0.2s; }
    .sidebar nav a:hover { background: #0f172a; color: white; }
    .btn-sair { padding: 12px; border: none; border-radius: 10px; background: #7f1d1d; color: #fca5a5; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-sair:hover { background: #dc2626; color: white; }

    .content { flex: 1; padding: 40px; }
    .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .topo h1 { font-size: 28px; font-weight: 700; color: #f1f5f9; }
    .btn-add { padding: 10px 20px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-add:hover { background: #1d4ed8; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .card-stat { background: #1e293b; padding: 20px 24px; border-radius: 14px; border-left: 4px solid #2563eb; }
    .card-stat h3 { color: #94a3b8; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-stat span { font-size: 36px; font-weight: 700; color: #f1f5f9; }

    .tabela-wrap { background: #1e293b; border-radius: 16px; overflow: hidden; }
    .tabela-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 24px; border-bottom: 1px solid #334155; }
    .tabela-header h2 { font-size: 16px; color: #e2e8f0; }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #0f172a; }
    thead th { padding: 14px 20px; text-align: left; font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 600; }
    tbody tr { border-bottom: 1px solid #1e293b; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #263347; }
    tbody td { padding: 16px 20px; font-size: 14px; color: #cbd5e1; }
    tbody td:first-child { color: #64748b; font-size: 13px; }
    tbody td:nth-child(2) { color: #f1f5f9; font-weight: 500; }

    .badge { display: inline-block; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; }
    .badge-admin   { background: #1e3a5f; color: #60a5fa; }
    .badge-usuario { background: #1a3a2a; color: #4ade80; }

    .btn-excluir { padding: 6px 14px; border: none; border-radius: 6px; background: transparent; color: #f87171; border: 1px solid #7f1d1d; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-excluir:hover { background: #dc2626; color: white; border-color: #dc2626; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; }
    .modal-box { width: 420px; background: #1e293b; padding: 32px; border-radius: 20px; box-shadow: 0 0 40px rgba(0,0,0,0.5); }
    .modal-box h2 { margin-bottom: 24px; font-size: 20px; }
    .modal-box input { width: 100%; padding: 13px; margin-bottom: 12px; border: 1px solid #334155; border-radius: 10px; background: #0f172a; color: white; font-size: 15px; outline: none; }
    .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
    .modal-btns button { flex: 1; padding: 13px; border: none; border-radius: 10px; color: white; cursor: pointer; font-size: 15px; transition: 0.2s; }
    .btn-confirmar { background: #2563eb; }
    .btn-confirmar:hover { background: #1d4ed8; }
    .btn-cancelar  { background: #374151; }
    .btn-cancelar:hover { background: #4b5563; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <h2>Sistema TI</h2>
        <small>Manutenção de Equipamentos</small>
        <nav>
          <a href="#">📊 Dashboard</a>
          <a href="#">👥 Usuários</a>
          <a href="#">🔧 Manutenções</a>
          <a href="#">🖥️ Equipamentos</a>
        </nav>
      </div>
      <button class="btn-sair" onclick="sair()">⬅ Sair</button>
    </aside>

    <main class="content">
      <div class="topo">
        <h1>Usuários do Sistema</h1>
        <button class="btn-add" id="btnNovoUsuario" style="display:none" onclick="abrirModal()">+ Novo Usuário</button>
      </div>

      <div class="cards">
        <div class="card-stat">
          <h3>Total de Usuários</h3>
          <span id="totalUsuarios">0</span>
        </div>
      </div>

      <div class="tabela-wrap">
        <div class="tabela-header"><h2>Lista de Usuários</h2></div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Login</th>
              <th>Perfil</th>
              <th id="thAcao" style="display:none">Ação</th>
            </tr>
          </thead>
          <tbody id="tbody-usuarios">
            <tr><td colspan="5" style="text-align:center;padding:30px;color:#475569">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2>Novo Usuário</h2>
      <input type="text"     id="nome"  placeholder="Nome completo">
      <input type="text"     id="login" placeholder="Login">
      <input type="password" id="senha" placeholder="Senha">
      <div class="modal-btns">
        <button class="btn-confirmar" onclick="cadastrarUsuario()">Cadastrar</button>
        <button class="btn-cancelar"  onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    // Verifica sessão
    const isAdmin = sessionStorage.getItem("admin") === "true";
    const logado  = sessionStorage.getItem("admin") !== null;

    if (!logado) {
      window.location.href = "/login.html";
    }

    // Mostra elementos exclusivos do admin
    if (isAdmin) {
      document.getElementById("btnNovoUsuario").style.display = "block";
      document.getElementById("thAcao").style.display = "";
    }

    function badgePerfil(perfil) {
      const cls = perfil === "Administrador" ? "badge-admin" : "badge-usuario";
      return `<span class="badge ${cls}">${perfil}</span>`;
    }

    async function carregarUsuarios() {
      try {
        const res      = await fetch("/usuarios");
        const usuarios = await res.json();

        document.getElementById("totalUsuarios").innerText = usuarios.length + 1; // +1 pelo admin fixo

        const tbody = document.getElementById("tbody-usuarios");

        const acoAdmin = isAdmin ? `<td>—</td>` : "";
        const adminRow = `
          <tr>
            <td>#0</td>
            <td>Administrador</td>
            <td>admin@sistema.com</td>
            <td>${badgePerfil("Administrador")}</td>
            ${acoAdmin}
          </tr>`;

        const linhas = usuarios.map(u => {
          const acao = isAdmin
            ? `<td><button class="btn-excluir" onclick="deletarUsuario(${u.usuario_id})">Excluir</button></td>`
            : "";
          return `
            <tr>
              <td>#${u.usuario_id}</td>
              <td>${u.nome}</td>
              <td>${u.login}</td>
              <td>${badgePerfil("Usuário")}</td>
              ${acao}
            </tr>`;
        }).join("");

        tbody.innerHTML = adminRow + linhas;
      } catch (err) {
        console.error(err);
      }
    }

    async function deletarUsuario(id) {
      if (!isAdmin) return; // segurança extra
      if (!confirm("Deseja remover este usuário?")) return;
      await fetch(`/usuarios/${id}`, { method: "DELETE" });
      carregarUsuarios();
    }

    async function cadastrarUsuario() {
      if (!isAdmin) return;
      const nome  = document.getElementById("nome").value.trim();
      const login = document.getElementById("login").value.trim();
      const senha = document.getElementById("senha").value;
      if (!nome || !login || !senha) { alert("Preencha todos os campos."); return; }
      await fetch("/usuarios", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nome, login, senha }),
      });
      fecharModal();
      carregarUsuarios();
    }

    function sair() {
      sessionStorage.clear();
      window.location.href = "/login.html";
    }

    function abrirModal()  { document.getElementById("modal").style.display = "flex"; }
    function fecharModal() {
      document.getElementById("modal").style.display = "none";
      ["nome","login","senha"].forEach(id => document.getElementById(id).value = "");
    }

    carregarUsuarios();
  </script>
</body>
</html>
