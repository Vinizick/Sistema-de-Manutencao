<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema TI - Serviços</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: white; font-family: Arial, sans-serif; }
    .layout { display: flex; min-height: 100vh; }

    .sidebar {
      width: 250px; background: #020617; padding: 30px;
      display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
    }
    .sidebar h2 { font-size: 24px; margin-bottom: 8px; color: #e2e8f0; }
    .sidebar small { color: #475569; font-size: 12px; display: block; margin-bottom: 40px; }
    .sidebar nav { display: flex; flex-direction: column; gap: 8px; }
    .sidebar nav a { color: #94a3b8; text-decoration: none; font-size: 15px; padding: 10px 14px; border-radius: 8px; transition: 0.2s; }
    .sidebar nav a:hover, .sidebar nav a.ativo { background: #0f172a; color: white; }
    .btn-sair { padding: 12px; border: none; border-radius: 10px; background: #7f1d1d; color: #fca5a5; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-sair:hover { background: #dc2626; color: white; }

    .content { flex: 1; padding: 40px; }
    .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .topo h1 { font-size: 28px; font-weight: 700; color: #f1f5f9; }
    .btn-add { padding: 10px 20px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; font-size: 14px; transition: 0.2s; }
    .btn-add:hover { background: #1d4ed8; }

    .card-stat { background: #1e293b; padding: 20px 24px; border-radius: 14px; border-left: 4px solid #8b5cf6; display: inline-block; margin-bottom: 32px; min-width: 180px; }
    .card-stat h3 { color: #94a3b8; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
    .card-stat span { font-size: 36px; font-weight: 700; color: #f1f5f9; }

    .tabela-wrap { background: #1e293b; border-radius: 16px; overflow: hidden; }
    .tabela-header { padding: 20px 24px; border-bottom: 1px solid #334155; }
    .tabela-header h2 { font-size: 16px; color: #e2e8f0; }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #0f172a; }
    thead th { padding: 14px 20px; text-align: left; font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.07em; }
    tbody tr { border-bottom: 1px solid #0f172a; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #263347; }
    tbody td { padding: 16px 20px; font-size: 14px; color: #cbd5e1; }
    tbody td:first-child { color: #64748b; }
    tbody td:nth-child(2) { color: #f1f5f9; font-weight: 500; }

    .valor { color: #4ade80; font-weight: 600; }

    .acoes { display: flex; gap: 8px; }
    .btn-editar  { padding: 6px 14px; border: 1px solid #1d4ed8; border-radius: 6px; background: transparent; color: #60a5fa; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-editar:hover  { background: #2563eb; color: white; }
    .btn-excluir { padding: 6px 14px; border: 1px solid #7f1d1d; border-radius: 6px; background: transparent; color: #f87171; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-excluir:hover { background: #dc2626; color: white; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; }
    .modal-box { width: 440px; background: #1e293b; padding: 32px; border-radius: 20px; }
    .modal-box h2 { margin-bottom: 24px; font-size: 20px; }
    .modal-box input { width: 100%; padding: 13px; margin-bottom: 12px; border: 1px solid #334155; border-radius: 10px; background: #0f172a; color: white; font-size: 15px; outline: none; }
    .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
    .modal-btns button { flex: 1; padding: 13px; border: none; border-radius: 10px; color: white; cursor: pointer; font-size: 15px; }
    .btn-confirmar { background: #2563eb; }
    .btn-confirmar:hover { background: #1d4ed8; }
    .btn-cancelar  { background: #374151; }
    .btn-cancelar:hover { background: #4b5563; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <h2>Sistema TI</h2>
        <small>Manutenção de Equipamentos</small>
        <nav>
          <a href="/usuarios.html">📊 Dashboard</a>
          <a href="/usuarios.html">👥 Usuários</a>
          <a href="/equipamentos.html">🖥️ Equipamentos</a>
          <a href="/servicos.html" class="ativo">🔧 Serviços</a>
        </nav>
      </div>
      <button class="btn-sair" onclick="sair()">⬅ Sair</button>
    </aside>

    <main class="content">
      <div class="topo">
        <h1>Serviços de Manutenção</h1>
        <button class="btn-add" id="btnNovo" style="display:none" onclick="abrirModal()">+ Novo Serviço</button>
      </div>

      <div class="card-stat">
        <h3>Total de Serviços</h3>
        <span id="totalServicos">0</span>
      </div>

      <div class="tabela-wrap">
        <div class="tabela-header"><h2>Lista de Serviços</h2></div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Descrição</th>
              <th>Valor</th>
              <th id="thAcao"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="modalTitulo">Novo Serviço</h2>
      <input type="hidden" id="servico_id">
      <input type="text"   id="descricao" placeholder="Descrição do serviço (ex: Formatação, Troca de HD)">
      <input type="number" id="valor"     placeholder="Valor (R$)" step="0.01" min="0">
      <div class="modal-btns">
        <button class="btn-confirmar" onclick="salvar()">Salvar</button>
        <button class="btn-cancelar"  onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const isAdmin = sessionStorage.getItem("admin") === "true";
    const logado  = sessionStorage.getItem("admin") !== null;

    if (!logado) window.location.href = "/login.html";
    if (isAdmin) {
      document.getElementById("btnNovo").style.display = "block";
      document.getElementById("thAcao").textContent = "Ações";
    }

    async function carregar() {
      const res  = await fetch("/servicos");
      const list = await res.json();

      document.getElementById("totalServicos").innerText = list.length;

      const tbody = document.getElementById("tbody");

      if (list.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:30px;color:#475569">Nenhum serviço cadastrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(s => {
        const acao = isAdmin ? `
          <td class="acoes">
            <button class="btn-editar"  onclick="abrirEditar(${s.servico_id},'${s.descricao}',${s.valor})">Editar</button>
            <button class="btn-excluir" onclick="excluir(${s.servico_id})">Excluir</button>
          </td>` : "<td></td>";

        return `
          <tr>
            <td>#${s.servico_id}</td>
            <td>${s.descricao}</td>
            <td class="valor">R$ ${parseFloat(s.valor).toFixed(2)}</td>
            ${acao}
          </tr>`;
      }).join("");
    }

    function abrirModal() {
      document.getElementById("modalTitulo").textContent = "Novo Serviço";
      document.getElementById("servico_id").value = "";
      document.getElementById("descricao").value  = "";
      document.getElementById("valor").value      = "";
      document.getElementById("modal").style.display = "flex";
    }

    function abrirEditar(id, descricao, valor) {
      document.getElementById("modalTitulo").textContent = "Editar Serviço";
      document.getElementById("servico_id").value = id;
      document.getElementById("descricao").value  = descricao;
      document.getElementById("valor").value      = valor;
      document.getElementById("modal").style.display = "flex";
    }

    function fecharModal() {
      document.getElementById("modal").style.display = "none";
    }

    async function salvar() {
      const id       = document.getElementById("servico_id").value;
      const descricao = document.getElementById("descricao").value.trim();
      const valor    = document.getElementById("valor").value;

      if (!descricao || !valor) { alert("Preencha todos os campos."); return; }

      const method = id ? "PUT" : "POST";
      const url    = id ? `/servicos/${id}` : "/servicos";

      await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ descricao, valor }),
      });

      fecharModal();
      carregar();
    }

    async function excluir(id) {
      if (!confirm("Deseja excluir este serviço?")) return;
      await fetch(`/servicos/${id}`, { method: "DELETE" });
      carregar();
    }

    function sair() {
      sessionStorage.clear();
      window.location.href = "/login.html";
    }

    carregar();
  </script>
</body>
</html>
