<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema TI - Cadastro</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      height: 100vh;
      background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
        url("https://images.unsplash.com/photo-1518770660439-4636190af475");
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }

    .box {
      width: 400px;
      background: rgba(15,23,42,0.95);
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      color: white;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .box h1 { font-size: 36px; margin-bottom: 8px; }
    .box p.sub { color: #94a3b8; margin-bottom: 28px; }

    .box input {
      width: 100%;
      padding: 15px;
      margin-bottom: 16px;
      border: none;
      border-radius: 10px;
      background: #1e293b;
      color: white;
      font-size: 16px;
    }

    .box button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .box button:hover { background: #1d4ed8; }

    #msg {
      margin-bottom: 12px;
      font-size: 14px;
      padding: 10px;
      border-radius: 8px;
      display: none;
    }

    .voltar {
      display: block;
      margin-top: 16px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 14px;
    }

    .voltar:hover { color: white; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Criar Conta</h1>
    <p class="sub">Preencha os dados para se cadastrar</p>

    <input type="text"     id="nome"  placeholder="Nome completo">
    <input type="text"     id="login" placeholder="Login">
    <input type="password" id="senha" placeholder="Senha">

    <p id="msg"></p>

    <button onclick="cadastrar()">Cadastrar</button>
    <a class="voltar" href="/login.html">← Voltar para o login</a>
  </div>

  <script>
    function mostrarMsg(texto, cor) {
      const msg = document.getElementById("msg");
      msg.style.color      = cor;
      msg.style.background = cor === "#4ade80" ? "#052e16" : "#2d0a0a";
      msg.style.display    = "block";
      msg.textContent      = texto;
    }

    async function cadastrar() {
      const nome  = document.getElementById("nome").value.trim();
      const login = document.getElementById("login").value.trim();
      const senha = document.getElementById("senha").value;

      if (!nome || !login || !senha) {
        mostrarMsg("Preencha todos os campos.", "#f87171");
        return;
      }

      try {
        const res  = await fetch("/usuarios", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ nome, login, senha }),
        });
        const data = await res.json();

        if (res.ok) {
          mostrarMsg("Cadastro realizado! Redirecionando...", "#4ade80");
          setTimeout(() => window.location.href = "/login.html", 1500);
        } else {
          mostrarMsg("Erro: " + (data.sqlMessage || data.mensagem || JSON.stringify(data)), "#f87171");
        }
      } catch (err) {
        mostrarMsg("Erro de conexão: " + err.message, "#f87171");
      }
    }
  </script>
</body>
</html>
