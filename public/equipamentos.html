<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema TI - Equipamentos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0f172a; color: white; font-family: Arial, sans-serif; }
    .layout { display: flex; min-height: 100vh; }

    .sidebar { width: 250px; background: #020617; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
    .sidebar h2 { font-size: 24px; margin-bottom: 8px; color: #e2e8f0; }
    .sidebar small { color: #475569; font-size: 12px; display: block; margin-bottom: 40px; }
    .sidebar nav { display: flex; flex-direction: column; gap: 8px; }
    .sidebar nav a { color: #94a3b8; text-decoration: none; font-size: 15px; padding: 10px 14px; border-radius: 8px; transition: 0.2s; }
    .sidebar nav a:hover, .sidebar nav a.ativo { background: #0f172a; color: white; }
    .btn-sair { padding: 12px; border: none; border-radius: 10px; background: #7f1d1d; color: #fca5a5; cursor: pointer; font-size: 14px; }
    .btn-sair:hover { background: #dc2626; color: white; }

    .content { flex: 1; padding: 40px; }
    .topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
    .topo h1 { font-size: 28px; font-weight: 700; color: #f1f5f9; }
    .btn-add { padding: 10px 20px; border: none; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; font-size: 14px; }
    .btn-add:hover { background: #1d4ed8; }

    .card-stat { background: #1e293b; padding: 20px 24px; border-radius: 14px; border-left: 4px solid #f59e0b; display: inline-block; margin-bottom: 32px; min-width: 180px; }
    .card-stat h3 { color: #94a3b8; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
    .card-stat span { font-size: 36px; font-weight: 700; color: #f1f5f9; }

    .tabela-wrap { background: #1e293b; border-radius: 16px; overflow: hidden; }
    .tabela-header { padding: 20px 24px; border-bottom: 1px solid #334155; }
    .tabela-header h2 { font-size: 16px; color: #e2e8f0; }

    table { width: 100%; border-collapse: collapse; }
    thead tr { background: #0f172a; }
    thead th { padding: 14px 20px; text-align: left; font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: 0.07em; }
    tbody tr { border-bottom: 1px solid #0f172a; transition: background 0.15s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #263347; }
    tbody td { padding: 16px 20px; font-size: 14px; color: #cbd5e1; }
    tbody td:first-child { color: #64748b; }
    tbody td:nth-child(2) { color: #f1f5f9; font-weight: 500; }
    .valor { color: #4ade80; font-weight: 600; }

    .acoes { display: flex; gap: 8px; }
    .btn-editar  { padding: 6px 14px; border: 1px solid #1d4ed8; border-radius: 6px; background: transparent; color: #60a5fa; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-editar:hover  { background: #2563eb; color: white; }
    .btn-excluir { padding: 6px 14px; border: 1px solid #7f1d1d; border-radius: 6px; background: transparent; color: #f87171; cursor: pointer; font-size: 13px; transition: 0.2s; }
    .btn-excluir:hover { background: #dc2626; color: white; }

    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); display: none; justify-content: center; align-items: center; z-index: 99; }
    .modal-box { width: 460px; background: #1e293b; padding: 32px; border-radius: 20px; max-height: 90vh; overflow-y: auto; }
    .modal-box h2 { margin-bottom: 24px; font-size: 20px; }
    .modal-box input, .modal-box textarea { width: 100%; padding: 13px; margin-bottom: 12px; border: 1px solid #334155; border-radius: 10px; background: #0f172a; color: white; font-size: 15px; outline: none; }
    .modal-box textarea { resize: vertical; min-height: 80px; }
    .label { color: #94a3b8; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; display: block; }
    .separador { border: none; border-top: 1px solid #334155; margin: 16px 0; }
    .modal-btns { display: flex; gap: 10px; margin-top: 8px; }
    .modal-btns button { flex: 1; padding: 13px; border: none; border-radius: 10px; color: white; cursor: pointer; font-size: 15px; }
    .btn-confirmar { background: #2563eb; }
    .btn-confirmar:hover { background: #1d4ed8; }
    .btn-cancelar  { background: #374151; }
    .btn-cancelar:hover { background: #4b5563; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div>
        <h2>Sistema TI</h2>
        <small>Manutenção de Equipamentos</small>
        <nav>
  <a href="/dashboard.html">📊 Dashboard</a>
  <a href="/usuarios.html">👥 Usuários</a>
  <a href="/equipamentos.html">🖥️ Equipamentos</a>
  <a href="/manutencoes.html">🔧 Manutenções</a>
</nav>
      </div>
      <button class="btn-sair" onclick="sair()">⬅ Sair</button>
    </aside>

    <main class="content">
      <div class="topo">
        <h1>Equipamentos</h1>
        <button class="btn-add" id="btnNovo" style="display:none" onclick="abrirModal()">+ Novo Equipamento</button>
      </div>

      <div class="card-stat">
        <h3>Total de Equipamentos</h3>
        <span id="totalEquipamentos">0</span>
      </div>

      <div class="tabela-wrap">
        <div class="tabela-header"><h2>Lista de Equipamentos</h2></div>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Descrição</th>
              <th>Especificações</th>
              <th>Data Manutenção</th>
              <th>Valor</th>
              <th id="thAcao"></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal" id="modal">
    <div class="modal-box">
      <h2 id="modalTitulo">Novo Equipamento</h2>
      <input type="hidden" id="equipamento_id">

      <span class="label">Descrição do Aparelho</span>
      <input type="text" id="descricao" placeholder="Ex: Notebook Dell, CPU, Impressora...">

      <span class="label">Especificações Técnicas</span>
      <textarea id="especificacoes" placeholder="Ex: Intel i5, 8GB RAM, SSD 256GB..." style="min-height:80px;resize:vertical"></textarea>

      <hr class="separador">
      <span class="label">Dados da Manutenção</span>

      <input type="datetime-local" id="data_manutencao">
      <input type="number" id="valor" placeholder="Valor do serviço (R$)" step="0.01" min="0">
      <textarea id="laudo" placeholder="Laudo / Observações (opcional)"></textarea>

      <div class="modal-btns">
        <button class="btn-confirmar" onclick="salvar()">Salvar</button>
        <button class="btn-cancelar"  onclick="fecharModal()">Cancelar</button>
      </div>
    </div>
  </div>

  <script>
    const isAdmin = sessionStorage.getItem("admin") === "true";
    if (!sessionStorage.getItem("admin")) window.location.href = "/login.html";

    if (isAdmin) {
      document.getElementById("btnNovo").style.display = "block";
      document.getElementById("thAcao").textContent = "Ações";
    }

    async function carregar() {
      const [resEq, resMat] = await Promise.all([
        fetch("/equipamentos"),
        fetch("/manutencoes")
      ]);
      const equipamentos = await resEq.json();
      const manutencoes  = await resMat.json();

      document.getElementById("totalEquipamentos").innerText = equipamentos.length;

      const tbody = document.getElementById("tbody");

      if (!equipamentos.length) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:30px;color:#475569">Nenhum equipamento cadastrado.</td></tr>`;
        return;
      }

      tbody.innerHTML = equipamentos.map(e => {
        // Pega a manutenção mais recente deste equipamento
        const mans = manutencoes.filter(m => m.equipamento_id === e.equipamento_id || m.equipamento === e.descricao);
        const ultima = mans[0];

        const data  = ultima ? new Date(ultima.data).toLocaleString('pt-BR') : '—';
        const valor = ultima ? `R$ ${parseFloat(ultima.valor).toFixed(2)}` : '—';

        const acao = isAdmin ? `
          <td class="acoes">
            <button class="btn-editar"  onclick="abrirEditar(${e.equipamento_id},'${e.descricao}','${(e.especificacoes||'').replace(/'/g,"\\'")}')">Editar</button>
            <button class="btn-excluir" onclick="excluir(${e.equipamento_id})">Excluir</button>
          </td>` : "<td></td>";

        return `
          <tr>
            <td>#${e.equipamento_id}</td>
            <td>${e.descricao}</td>
            <td style="color:#94a3b8;font-size:13px">${e.especificacoes || '—'}</td>
            <td>${data}</td>
            <td class="valor">${valor}</td>
            ${acao}
          </tr>`;
      }).join("");
    }

    function abrirModal() {
      document.getElementById("modalTitulo").textContent  = "Novo Equipamento";
      document.getElementById("equipamento_id").value    = "";
      document.getElementById("descricao").value         = "";
      document.getElementById("data_manutencao").value   = "";
      document.getElementById("valor").value             = "";
      document.getElementById("laudo").value             = "";
      document.getElementById("modal").style.display     = "flex";
    }

    function abrirEditar(id, descricao, especificacoes) {
      document.getElementById("modalTitulo").textContent    = "Editar Equipamento";
      document.getElementById("equipamento_id").value      = id;
      document.getElementById("descricao").value           = descricao;
      document.getElementById("especificacoes").value      = especificacoes || "";
      document.getElementById("data_manutencao").value     = "";
      document.getElementById("valor").value               = "";
      document.getElementById("laudo").value               = "";
      document.getElementById("modal").style.display       = "flex";
    }

    function fecharModal() { document.getElementById("modal").style.display = "none"; }

    async function salvar() {
      const id       = document.getElementById("equipamento_id").value;
      const descricao      = document.getElementById("descricao").value.trim();
      const especificacoes = document.getElementById("especificacoes").value.trim();
      const data     = document.getElementById("data_manutencao").value;
      const valor    = document.getElementById("valor").value;
      const laudo    = document.getElementById("laudo").value.trim();

      if (!descricao) { alert("Informe a descrição do equipamento."); return; }

      // Salva ou edita equipamento
      const method = id ? "PUT" : "POST";
      const url    = id ? `/equipamentos/${id}` : "/equipamentos";
      const resEq  = await fetch(url, {
        method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ descricao, valor_diaria: valor || 0, especificacoes }),
      });
      const eq = await resEq.json();

      // Se informou data e valor, registra manutenção automaticamente
      if (data && valor) {
        const equipamento_id = id || eq.insertId;
        await fetch("/manutencoes", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            data,
            laudo,
            servico_id: 1,
            equipamento_id,
            valor
          }),
        });
      }

      fecharModal();
      carregar();
    }

    async function excluir(id) {
      if (!confirm("Deseja excluir este equipamento?")) return;
      await fetch(`/equipamentos/${id}`, { method: "DELETE" });
      carregar();
    }

    function sair() { sessionStorage.clear(); window.location.href = "/login.html"; }

    carregar();
  </script>
</body>
</html>
